<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ServiceGo - لوحة التحكم الذكية</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#070b14;--card:#0e1525;--bd:#1c2a45;--pr:#1f6bff;--pu:#8b3dff;--gr:#14b88a;--or:#f59e0b;--mu:#8a97b2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-top:env(safe-area-inset-top);min-height:100vh;}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;transition:all 0.3s ease;}

/* تحسينات الشاشات الكبيرة (الكمبيوتر) لتتطابق مع لوحة التحكم الاحترافية */
@media (min-width: 768px) {
  body { display:flex; justify-content:center; align-items:center; padding:20px; background:radial-gradient(circle at 50% 20%, #0b2a5b 0%, var(--bg) 80%); }
  #app { max-width:1200px; width:100%; min-height:85vh; border-radius:24px; border:1px solid var(--bd); box-shadow:0 0 40px rgba(31, 107, 255, 0.15); display:flex; flex-direction:row; overflow:hidden; background:var(--bg); position:relative; }
  .page { flex:1; padding:30px; overflow-y:auto; max-height:85vh; padding-bottom:30px !important; }
  .nav { position:relative !important; width:260px; height:100%; border-top:none !important; border-inline-end:1px solid var(--bd); flex-direction:column; justify-content:flex-start; padding:30px 15px; gap:10px; background:var(--card); }
  .nav button { flex:none !important; text-align:start; padding:12px 16px !important; border-radius:12px; display:flex; align-items:center; gap:12px; font-size:14px !important; }
  .nav button.on { background:rgba(31, 107, 255, 0.15); }
  .nav button i { display:inline-block !important; font-size:18px; }
  .nav .aib { transform:none !important; margin:10px 0; }
  .nav .aib i { width:44px !important; height:44px !important; font-size:20px !important; margin:0 !important; }
  .fab { inset-inline-end:40px !important; bottom:40px !important; }
}

.glow{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#0b2a5b,var(--bg) 70%)}
.logo{font-size:84px;font-weight:900;font-style:italic;line-height:1;background:linear-gradient(135deg,#3aa0ff,#1f4fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{font-size:34px;font-weight:800;margin:6px 0}.brand b{color:var(--pr)}
.mu{color:var(--mu)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pr);border:0;border-radius:12px;padding:14px;width:100%;font-weight:700;cursor:pointer;margin-top:10px}
.btn.o{background:transparent;border:1px solid var(--bd)}
.link{background:none;border:0;color:var(--pr);font-size:17px;cursor:pointer;padding:10px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px;margin-top:10px}
.lang{position:absolute;top:12px;inset-inline-end:12px;width:auto;padding:8px}
.type{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border-radius:14px;padding:14px;margin-top:12px;cursor:pointer;background:none}
.type small{display:block;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;cursor:pointer}.row>div:nth-child(2){flex:1;min-width:0}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#1f6bff26}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;padding:3px 8px;border-radius:8px;font-weight:600;display:inline-block}
.page{padding:16px 16px 90px}
h2{margin:6px 0 14px;font-size:19px;text-align:center}
.stats{display:flex;gap:8px;margin:14px 0}.stats .card{flex:1;text-align:center;margin:0}.stats b{display:block;font-size:24px;margin-top:4px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:1000;}
.nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--mu);font-size:11px;cursor:pointer}.nav button.on{color:var(--pr)}.nav i{display:block;font-size:20px;font-style:normal}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.chips button{white-space:nowrap;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:7px 14px;cursor:pointer}.chips .on{background:var(--pr)}
.fab{position:fixed;bottom:80px;inset-inline-end:max(16px,calc(50% - 244px));width:52px;height:52px;border-radius:50%;background:var(--pr);border:0;font-size:28px;cursor:pointer;z-index:900;}
.kv{display:flex;gap:10px;padding:7px 0}.kv span:first-child{width:105px;color:var(--mu);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px}
.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center}.donut span{background:var(--card);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:800}
#map{height:calc(100vh - 150px);border-radius:16px}
.imgs{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.imgs img{width:70px;height:70px;object-fit:cover;border-radius:10px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:999}#modal>div{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px}
.msg{color:#ffb4b4;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div class="glow">
    <div class="logo">SG</div>
    <div class="brand">Service<b>Go</b></div>
    <p class="mu">منظومة الخدمات الذكية الموحدة</p>
    <button class="btn" onclick="app.init()">بدء التشغيل والدخول</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const app = {
    init() {
      document.getElementById('app').innerHTML = `
        <div class="nav">
          <button class="on" onclick="app.changeTab('home')"><i>🏠</i>الرئيسية</button>
          <button onclick="app.changeTab('map')"><i>🗺️</i>الخريطة</button>
          <button onclick="app.changeTab('reports')"><i>📊</i>التقارير</button>
          <button onclick="app.changeTab('ai')"><i>🤖</i>المساعد الذكي</button>
        </div>
        <div class="page" id="main-content">
          <h2>لوحة التحكم الرئيسية</h2>
          <div class="card">
            <p>أهلاً بك في نظام ServiceGo. الواجهة الآن متجاوبة بالكامل وتعمل بشكل ممتاز على الشاشات الكبيرة والهواتف.</p>
            <button class="btn" onclick="alert('تم تفعيل النظام بنجاح!')">تحديث البيانات</button>
          </div>
        </div>
      `;
    },
    changeTab(tab) {
      const content = document.getElementById('main-content');
      if(tab === 'home') {
        content.innerHTML = `<h2>لوحة التحكم الرئيسية</h2><div class="card"><p>مرحباً بك في الواجهة الأساسية.</p></div>`;
      } else if(tab === 'map') {
        content.innerHTML = `<h2>خريطة الخدمات</h2><div id="map"></div>`;
        setTimeout(() => {
          const map = L.map('map').setView([36.8065, 10.1815], 13);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        }, 100);
      } else if(tab === 'reports') {
        content.innerHTML = `<h2>التقارير والإحصائيات</h2><div class="card"><p>عرض الرسوم البيانية والأداء.</p></div>`;
      } else if(tab === 'ai') {
        content.innerHTML = `<h2>المساعد الذكي</h2><div class="card"><p>كيف يمكنني مساعدتك اليوم؟</p></div>`;
      }
    }
  };
</script>
</body>
</html>
